[package]
name = "halo-browser"
version = "1.1.0"
edition = "2024"
description = "Halo: a fast, light Windows web browser in Rust on the Blink/V8 engine (WebView2)"
readme = "README.md"
rust-version = "1.85"
repository = "https://github.com/mayarakwad/HaloBrowser"
homepage = "https://github.com/mayarakwad/HaloBrowser"

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
png = "0.18.1"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tao = "0.37.2"
ureq = { version = "3.5.2", default-features = false, features = ["native-tls", "gzip"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
winreg = "0.56.0"
wry = "0.57.2"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }

[target."cfg(windows)".dependencies]
webview2-com = "0.39"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[build-dependencies]
embed-resource = "3.0.12"
serde_json = "1.0.154"
