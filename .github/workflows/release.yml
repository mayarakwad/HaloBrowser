name: Release

# Runs when you publish a release on GitHub (or push a tag such as v0.2.0).
# It builds Halo and attaches the installer to that release.
on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Publishing a release can also fire the tag trigger: run one at a time per version.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked
        env:
          HALO_GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}

      - name: Make the installer and ZIP files
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || github.ref_name }}"
          New-Item -ItemType Directory -Force dist/Halo | Out-Null
          Copy-Item target/release/halo-browser.exe dist/HaloSetup.exe
          Copy-Item dist/HaloSetup.exe, README.md dist/Halo/
          Compress-Archive -Path dist/Halo -DestinationPath "dist/Halo-$tag-windows-x64.zip"
          (Get-FileHash dist/HaloSetup.exe -Algorithm SHA256).Hash + "  HaloSetup.exe" | Out-File -Encoding ascii dist/SHA256.txt
          (Get-FileHash "dist/Halo-$tag-windows-x64.zip" -Algorithm SHA256).Hash + "  Halo-$tag-windows-x64.zip" | Out-File -Encoding ascii -Append dist/SHA256.txt

      - name: Attach the files to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            dist/HaloSetup.exe
            dist/Halo-*-windows-x64.zip
            dist/SHA256.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          append_body: true
          body: |
            ## Install
            Download **HaloSetup.exe** below and open it. If Windows says *Windows protected your PC*, click **More info** then **Run anyway** (Halo isn't code-signed yet).

            Already using Halo? Run the new HaloSetup.exe: it updates Halo and keeps your bookmarks, settings and account.
