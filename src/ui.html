<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Halo</title>
<script src="http://halo.localhost/themes.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; font: 13px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--fg); user-select: none; }
body { background: var(--bg); background-size: cover; }
body.animated { background-size: 400% 400%; animation: drift 24s ease-in-out infinite; }
@keyframes drift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
#dimmer { position: fixed; inset: 0; background: #000; opacity: var(--dim); pointer-events: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: default; }
svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ib { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--fg); flex: none; }
.ib:hover { background: var(--hover); }
.ib:active { transform: scale(.94); }
.ib.on { color: var(--accent); }

#app { position: fixed; inset: 0; display: grid; grid-template-columns: var(--sw, 248px) 1fr; transition: grid-template-columns .18s ease; }
#app.horizontal { grid-template-columns: 1fr; }
#app.collapsed { --sw: 64px; }

/* Sidebar (vertical tabs) */
#sidebar { display: flex; flex-direction: column; min-width: 0; padding: 8px 6px 8px 8px; gap: 6px; overflow: hidden; }
#app.horizontal #sidebar { display: none; }
.side-top { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 4px; }
.mark { width: 22px; height: 22px; border-radius: 50%; flex: none; background: conic-gradient(from 200deg, var(--accent), #f472b6, #60a5fa, var(--accent)); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent); }
.brand { font-weight: 650; letter-spacing: .3px; flex: 1; white-space: nowrap; }
#app.collapsed .brand, #app.collapsed .side-search, #app.collapsed .tab .title, #app.collapsed .tab .x, #app.collapsed .newtab-btn span, #app.collapsed .side-bottom .lbl { display: none; }
#app.collapsed .side-top { flex-direction: column; height: auto; gap: 6px; padding: 4px 0; }
.side-search { display: flex; align-items: center; gap: 6px; background: var(--glass); border: 1px solid var(--border); border-radius: 10px; padding: 0 8px; height: 32px; backdrop-filter: blur(18px); }
.side-search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--fg); font: inherit; }
.side-search input::placeholder { color: var(--fg-dim); }
#pinned { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
#pinned:empty { display: none; }
#pinned .tab { height: 40px; justify-content: center; padding: 0; }
#pinned .tab .title, #pinned .tab .x { display: none; }
.tablist { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; overflow-x: hidden; flex: 1; min-height: 0; scrollbar-width: thin; }
.tab { display: flex; align-items: center; gap: 9px; height: 36px; padding: 0 6px 0 10px; border-radius: 10px; position: relative; flex: none; transition: background .12s; }
.tab:hover { background: var(--hover); }
.tab.active { background: var(--active); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.tab.asleep .fav, .tab.asleep .title { opacity: .5; }
.tab .fav { width: 16px; height: 16px; border-radius: 4px; flex: none; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; background: var(--accent); overflow: hidden; }
.tab .fav img { width: 16px; height: 16px; }
.tab .fav.spin { background: none; border: 2px solid var(--fg-dim); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tab .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab .media { color: var(--accent); display: grid; }
.tab .media svg { width: 14px; height: 14px; }
.tab .x { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; opacity: 0; }
.tab:hover .x, .tab.active .x { opacity: .8; }
.tab .x:hover { background: var(--hover); opacity: 1; }
.tab .x svg { width: 12px; height: 12px; }
.tab.dragover { outline: 2px solid var(--accent); outline-offset: -2px; }
#app.collapsed .tab { justify-content: center; padding: 0; }
.newtab-btn { display: flex; align-items: center; gap: 9px; height: 36px; padding: 0 10px; border-radius: 10px; color: var(--fg-dim); flex: none; }
.newtab-btn:hover { background: var(--hover); color: var(--fg); }
#app.collapsed .newtab-btn { justify-content: center; padding: 0; }
.side-bottom { display: flex; gap: 2px; padding-top: 4px; border-top: 1px solid var(--border); }
#app.collapsed .side-bottom { flex-direction: column; align-items: center; }

/* Main column */
#main { display: flex; flex-direction: column; min-width: 0; padding: 0 8px 8px 2px; }
#app.horizontal #main { padding-left: 8px; }
#hstrip { display: none; height: 40px; align-items: flex-end; gap: 4px; padding-top: 4px; }
#app.horizontal #hstrip { display: flex; }
#tabs-h { display: flex; gap: 4px; min-width: 0; flex: 0 1 auto; overflow: hidden; }
#tabs-h .tab { width: 210px; min-width: 44px; flex: 0 1 210px; height: 32px; border-radius: 10px; }
#tabs-h .tab.pinned { flex: 0 0 44px; width: 44px; justify-content: center; padding: 0; }
#tabs-h .tab.pinned .title, #tabs-h .tab.pinned .x { display: none; }
#hstrip .plus { height: 32px; width: 32px; }
.spacer { flex: 1; align-self: stretch; }
#toolbar { display: flex; align-items: center; gap: 4px; height: 48px; }
#omni { flex: 1; min-width: 120px; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; border-radius: 12px; background: var(--glass); border: 1px solid var(--border); backdrop-filter: blur(18px); position: relative; transition: background .15s, box-shadow .15s; }
#omni:focus-within { background: var(--glass-strong); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 70%, transparent); }
#omni .lock { color: var(--fg-dim); display: grid; }
#addr { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; color: var(--fg); font: 14px "Segoe UI Variable Text", "Segoe UI", sans-serif; user-select: text; }
#addr::placeholder { color: var(--fg-dim); }
#omni .ib { width: 28px; height: 28px; }
.winctl { display: flex; align-items: center; margin-left: 6px; align-self: flex-start; height: 40px; }
.winctl button { width: 42px; height: 32px; display: grid; place-items: center; border-radius: 8px; }
.winctl button:hover { background: var(--hover); }
.winctl button.close:hover { background: #e81123; color: #fff; }
.winctl svg { width: 14px; height: 14px; stroke-width: 1.4; }
#app.vertical .winctl { align-self: center; height: auto; }

#b-home { display: none; }
body.showhome #b-home { display: grid; }
#b-dl { position: relative; }
#b-dl .badge { position: absolute; top: 2px; right: 2px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: #111; font-size: 10px; font-weight: 700; display: none; place-items: center; line-height: 1; }
#b-dl.busy .badge { display: grid; }
#b-dl.pulse { animation: dlPulse .9s ease 2; }
@keyframes dlPulse { 50% { background: color-mix(in srgb, var(--accent) 40%, transparent); transform: translateY(3px); } }
.addext { display: none; height: 26px; padding: 0 11px; border-radius: 8px; border: 0; background: var(--accent); color: #111; font: 600 12px "Segoe UI", sans-serif; white-space: nowrap; flex: none; }
.addext.show { display: block; animation: addIn .25s ease both; }
.addext:disabled { opacity: .7; }
@keyframes addIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
#toast { position: absolute; inset: -1px; border-radius: inherit; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--accent); color: #111; font-weight: 600; opacity: 0; pointer-events: none; transform: translateY(-4px); transition: opacity .25s, transform .25s; z-index: 25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#toast.show { opacity: 1; transform: none; }
#bmbar { display: none; gap: 2px; height: 30px; align-items: center; margin: -6px 0 6px; overflow: hidden; }
body.showbm #bmbar { display: flex; }
.bm { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 8px; max-width: 190px; color: var(--fg); font-size: 12.5px; flex: none; transition: background .12s; }
.bm:hover { background: var(--hover); }
.bm .bl { width: 14px; height: 14px; border-radius: 4px; background: var(--accent); color: #111; font-size: 9px; font-weight: 700; display: grid; place-items: center; flex: none; }
.bm span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.bm.hint { color: var(--fg-dim); }
body.compact #toolbar { height: 40px; }
body.compact #omni { height: 30px; }
body.compact .ib { width: 28px; height: 28px; }
body.compact .tab, body.compact .newtab-btn { height: 30px; }
body.compact #tabs-h .tab { height: 28px; }
body.compact #hstrip { height: 34px; }
body.compact .side-top { height: 30px; }
body.compact #pinned .tab { height: 34px; }
body.square .tab, body.square #omni, body.square #content, body.square .ib, body.square .side-search, body.square .newtab-btn, body.square .bm, body.square #sugg, body.square .addext { border-radius: 3px; }
.extrow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--hover); margin-bottom: 8px; max-width: 640px; }
.extrow .eic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--glass); font-weight: 700; overflow: hidden; flex: none; }
.extrow .eic img { width: 24px; height: 24px; }
.extrow .t { flex: 1; min-width: 0; }
.extrow .t div:last-child { color: var(--fg-dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#content { flex: 1; position: relative; border-radius: 12px; overflow: hidden; background: var(--glass); border: 1px solid var(--border); min-height: 0; }
#progress { position: absolute; left: 0; top: 0; height: 2px; width: 0; background: var(--accent); z-index: 3; transition: width .4s ease, opacity .3s; }

/* Suggestions + panels (shown while the page is tucked away) */
#sugg { display: none; position: absolute; left: -1px; right: -1px; top: 40px; z-index: 20; background: var(--glass-strong); border: 1px solid var(--border); border-radius: 12px; padding: 6px; backdrop-filter: blur(24px); box-shadow: 0 18px 40px rgba(0,0,0,.35); }
#sugg.show { display: block; }
.srow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; }
.srow.sel, .srow:hover { background: var(--hover); }
.srow .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .u { color: var(--fg-dim); font-size: 12px; max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .k { color: var(--fg-dim); font-size: 11px; border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; }

.panel { display: none; position: absolute; inset: 0; z-index: 10; overflow: auto; padding: 28px 36px; background: var(--glass-strong); backdrop-filter: blur(30px); }
.panel.show { display: block; }
.panel h2 { margin: 0 0 4px; font-size: 22px; font-weight: 650; }
.panel h3 { margin: 26px 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: var(--fg-dim); font-weight: 600; }
.panel .sub { color: var(--fg-dim); margin-bottom: 8px; }
.panel .closep { position: absolute; right: 20px; top: 20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.sw { height: 92px; border-radius: 14px; border: 2px solid transparent; position: relative; overflow: hidden; background-size: cover; box-shadow: inset 0 0 0 1px var(--border); }
.sw.sel { border-color: var(--accent); }
.sw span { position: absolute; left: 8px; bottom: 7px; font-weight: 600; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,.35); color: #fff; }
.sw.custom { display: grid; place-items: center; background: var(--hover); color: var(--fg-dim); font-weight: 600; }
.sw.anim { background-size: 400% 400%; animation: drift 10s ease-in-out infinite; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
.dot.sel { border-color: var(--fg); }
.chip { padding: 8px 14px; border-radius: 10px; background: var(--hover); border: 1px solid var(--border); }
.chip.sel { background: var(--accent); color: #111; border-color: transparent; font-weight: 600; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 14px; border-radius: 12px; background: var(--hover); margin-bottom: 8px; max-width: 640px; }
.opt .d { color: var(--fg-dim); font-size: 12px; margin-top: 2px; }
.tog { width: 40px; height: 22px; border-radius: 11px; background: var(--border); position: relative; flex: none; }
.tog::after { content: ''; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.tog.on { background: var(--accent); }
.tog.on::after { left: 21px; }
select, input[type=range] { accent-color: var(--accent); }
select { background: var(--glass-strong); color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font: inherit; }
.btn { padding: 8px 14px; border-radius: 10px; background: var(--accent); color: #111; font-weight: 600; }
.btn.ghost { background: var(--hover); color: var(--fg); border: 1px solid var(--border); font-weight: 500; }
#palette { padding: 0; display: none; position: absolute; left: 50%; top: 40px; width: min(620px, 92%); transform: translateX(-50%); bottom: auto; inset-inline: auto; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 24px 60px rgba(0,0,0,.45); z-index: 30; }
#palette.show { display: block; }

/* ---------- motion ---------- */
:root { --ease: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.34,1.56,.64,1); }
#bgfade { position: fixed; inset: 0; pointer-events: none; opacity: 0; background-size: cover; }
.ib, .winctl button, .chip, .dot, .newtab-btn, .btn { transition: background .15s, color .2s, transform .18s var(--spring), box-shadow .2s; }
.ib svg { transition: transform .35s var(--spring); }
.ib:hover svg { transform: scale(1.12); }
#b-settings:hover svg, #btn-settings-v:hover svg { transform: rotate(75deg); }
#b-reload:hover svg { transform: rotate(-120deg); }
#b-back:hover svg { transform: translateX(-2px); }
#b-fwd:hover svg { transform: translateX(2px); }
#collapse svg { transition: transform .3s var(--spring); }
#app.collapsed #collapse svg { transform: scaleX(-1); }
.chip:hover, .dot:hover { transform: translateY(-1px) scale(1.06); }
.chip:active, .dot:active, .btn:active { transform: scale(.95); }
.mark { animation: spinSlow 14s linear infinite; }
body.busy .mark { animation-duration: 1.4s; }
@keyframes spinSlow { to { transform: rotate(360deg); } }
/* a new tab opens a gap smoothly, then its content glides in (no bounce) */
.tab.enter { animation: tabGrow .3s cubic-bezier(.25,.8,.25,1) both; overflow: hidden; }
.tab.enter > * { animation: tabContent .22s .06s cubic-bezier(.25,.8,.25,1) both; }
#tabs-h .tab.enter { animation-name: tabGrowH; }
#pinned .tab.enter { animation-name: tabFade; }
@keyframes tabGrow { from { height: 0; opacity: 0; } to { height: 36px; opacity: 1; } }
@keyframes tabGrowH { from { flex-basis: 0; width: 0; min-width: 0; opacity: 0; } to { flex-basis: 210px; width: 210px; min-width: 44px; opacity: 1; } }
@keyframes tabFade { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
@keyframes tabContent { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
.tab.leaving { animation: tabOut .18s ease-in forwards; pointer-events: none; overflow: hidden; }
#tabs-h .tab.leaving { animation-name: tabOutH; }
@keyframes tabOut { to { opacity: 0; transform: translateX(-20px); height: 0; } }
@keyframes tabOutH { to { opacity: 0; transform: scale(.85); flex-basis: 0; width: 0; min-width: 0; padding: 0; } }
.tab.active::before { content: ''; position: absolute; left: 3px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--accent); }
#tabs-h .tab.active::before { left: 16px; right: 16px; top: auto; bottom: -3px; width: auto; height: 3px; }
#pinned .tab.active::before { left: 12px; right: 12px; top: auto; bottom: 2px; width: auto; height: 3px; }
.tab.activated::before { animation: barIn .3s cubic-bezier(.25,.8,.25,1) both; }
@keyframes barIn { from { transform: scaleY(0); opacity: 0; } to { transform: none; opacity: 1; } }
.tab .media svg { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; transform: scale(.9); } }
#progress::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); animation: shimmer 1s linear infinite; }
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
#b-star.pop svg { animation: starPop .5s var(--spring); }
@keyframes starPop { 0% { transform: scale(.4) rotate(-40deg); } 60% { transform: scale(1.35) rotate(10deg); } 100% { transform: none; } }
.panel.show { animation: panelIn .3s var(--ease) both; }
@keyframes panelIn { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: none; } }
.panel.fresh .sw, .panel.fresh .opt, .panel.fresh .bmk, .panel.fresh h3, .panel.fresh .row { animation: rise .42s var(--ease) both; animation-delay: calc(var(--i, 0) * 28ms + 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.sw { transition: transform .25s var(--spring), box-shadow .25s, border-color .2s; }
.sw:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 10px 26px rgba(0,0,0,.3), inset 0 0 0 1px var(--border); }
.sw.sel { animation: selPulse .5s var(--spring); }
@keyframes selPulse { 0% { transform: scale(.94); } 100% { transform: none; } }
.tog, .tog::after { transition: background .2s, left .25s var(--spring); }
#palette.show { animation: popIn .26s var(--spring) both; }
@keyframes popIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px) scale(.96); } to { opacity: 1; transform: translateX(-50%); } }
#sugg.show { animation: dropIn .2s var(--ease) both; transform-origin: top center; }
@keyframes dropIn { from { opacity: 0; transform: translateY(-6px) scaleY(.96); } to { opacity: 1; transform: none; } }
.srow { transition: background .12s, padding-left .15s var(--ease); }
.srow.sel { padding-left: 14px; }
#app { animation: appIn .5s var(--ease) both; }
@keyframes appIn { from { opacity: 0; } to { opacity: 1; } }
body.nomotion *, body.nomotion *::before, body.nomotion *::after { animation: none !important; transition: none !important; }
#palette input { width: 100%; padding: 16px 18px; font-size: 16px; background: none; border: 0; border-bottom: 1px solid var(--border); outline: 0; color: var(--fg); user-select: text; }
#plist { max-height: 380px; overflow: auto; padding: 6px; }
.bmk { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: var(--hover); margin-bottom: 6px; max-width: 640px; }
.bmk .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.bmk .u { color: var(--fg-dim); font-size: 12px; }
</style>
</head>
<body>
<div id="bgfade"></div><div id="dimmer"></div>
<div id="app" class="vertical">
  <aside id="sidebar">
    <div class="side-top drag">
      <div class="mark"></div>
      <span class="brand">Halo</span>
      <button class="ib" id="collapse" title="Collapse sidebar (Ctrl+Shift+B)"></button>
    </div>
    <div class="side-search"><span class="ico-search"></span><input id="tabfilter" placeholder="Search tabs" spellcheck="false"></div>
    <div id="pinned"></div>
    <div id="tabs-v" class="tablist"></div>
    <button class="newtab-btn" id="newtab-v" title="New tab (Ctrl+T)"><span class="ico-plus"></span><span>New tab</span></button>
    <div class="side-bottom">
      <button class="ib" id="btn-themes-v" title="Themes and backgrounds"></button>
      <button class="ib" id="btn-bookmarks-v" title="Bookmarks"></button>
      <button class="ib" id="btn-settings-v" title="Settings"></button>
    </div>
  </aside>
  <main id="main">
    <div id="hstrip" class="drag">
      <div id="tabs-h"></div>
      <button class="ib plus" id="newtab-h" title="New tab (Ctrl+T)"></button>
      <div class="spacer drag"></div>
    </div>
    <div id="toolbar" class="drag">
      <button class="ib" id="b-back" title="Back (Alt+Left)"></button>
      <button class="ib" id="b-fwd" title="Forward (Alt+Right)"></button>
      <button class="ib" id="b-reload" title="Reload (F5)"></button>
      <button class="ib" id="b-home" title="Home"></button>
      <div id="omni">
        <span class="lock" id="lock"></span>
        <input id="addr" spellcheck="false" autocomplete="off" placeholder="Search Google or type a URL">
        <button class="addext" id="b-addext" title="Add this extension to Halo"></button>
        <button class="ib" id="b-star" title="Bookmark this page (Ctrl+D)"></button>
        <div id="sugg"></div>
        <div id="toast"></div>
      </div>
      <button class="ib" id="b-ext" title="Extensions"></button>
      <button class="ib" id="b-dl" title="Downloads (Ctrl+J)"><span class="badge" id="dlbadge"></span></button>
      <button class="ib" id="b-palette" title="Command bar (Ctrl+K)"></button>
      <button class="ib" id="b-themes" title="Themes and backgrounds"></button>
      <button class="ib" id="b-settings" title="Settings (Ctrl+,)"></button>
    </div>
    <div id="bmbar"></div>
    <div id="content">
      <div id="progress"></div>
      <section class="panel" id="p-themes"></section>
     <section class="panel" id="p-bookmarks"></section>
      <section class="panel" id="p-ext"></section>
      <section class="panel" id="palette"><input id="pin" placeholder="Type a command, a tab name or a search" spellcheck="false"><div id="plist"></div></section>
    </div>

  };
  $('#dimr').oninput = e => setS('bg_dim', parseFloat(e.target.value));
  $('#accentpick').onchange = e => setS('accent', e.target.value);
}
function renderBookmarks() {
  let h = '<button class="ib closep" data-close>' + I.x + '</button><h2>Bookmarks</h2><div class="sub">Press the star in the address bar (or Ctrl+D) to keep a page here.</div><h3>Saved pages</h3>';
  if (!S.bookmarks.length) h += '<div class="sub">Nothing saved yet.</div>';
  for (const [n, b] of S.bookmarks.entries()) h += '<div class="bmk" style="--i:' + n + '"><span class="fav" style="width:16px;height:16px;border-radius:4px;background:var(--accent);display:grid;place-items:center;font-size:10px;color:#fff;font-weight:700">' + esc((host(b.url) || '?')[0].toUpperCase()) + '</span><span class="t" data-open="' + esc(b.url) + '">' + esc(b.title || b.url) + '</span><span class="u">' + esc(host(b.url)) + '</span><button class="ib" data-unmark="' + esc(b.url) + '" title="Remove">' + I.x + '</button></div>';
  $('#p-bookmarks').innerHTML = h;
}
document.addEventListener('click', e => {
  const d = e.target.closest('[data-theme],[data-accent],[data-layout],[data-collapse],[data-engine],[data-tog],[data-close],[data-cdark],[data-nobg],[data-clearhist],[data-clearsite],[data-open],[data-unmark]');
  if (!d) return;
  if (d.dataset.theme) { setS('theme', d.dataset.theme); setS('custom_bg', false); }
  else if (d.dataset.accent !== undefined) setS('accent', d.dataset.accent);
  else if (d.dataset.layout) setS('layout', d.dataset.layout);
  else if (d.dataset.collapse !== undefined) setS('collapsed', !S.settings.collapsed);
  else if (d.dataset.engine) setS('engine', d.dataset.engine);
  else if (d.dataset.tog) setS(d.dataset.tog, !S.settings[d.dataset.tog]);
  else if (d.dataset.cdark) setS('custom_dark', d.dataset.cdark === '1');
  else if (d.dataset.nobg !== undefined) setS('custom_bg', false);
  else if (d.dataset.clearhist !== undefined) { post({ cmd: 'clearHistory' }); d.textContent = 'History cleared'; }
  else if (d.dataset.clearsite !== undefined) { post({ cmd: 'clearSiteData' }); d.textContent = 'Site data cleared'; }
  else if (d.dataset.open) { closePanels(); post({ cmd: 'newtab', url: d.dataset.open }); }
  else if (d.dataset.unmark) post({ cmd: 'unbookmark', url: d.dataset.unmark });
  else if (d.dataset.close !== undefined) closePanels();
});

// ---------- tabs ----------
function tabClick(e) {
  const x = e.target.closest('[data-x]');
  const t = e.target.closest('.tab');
  if (!t) return;
  if (x) { closeTab(+x.dataset.x); return; }
  closePanels();
  post({ cmd: 'activate', id: +t.dataset.id });
}
for (const el of ['#tabs-v', '#pinned', '#tabs-h']) {
  const box = $(el);
  box.addEventListener('click', tabClick);
  box.addEventListener('auxclick', e => { const t = e.target.closest('.tab'); if (t && e.button === 1) closeTab(+t.dataset.id); });
  box.addEventListener('dblclick', e => { const t = e.target.closest('.tab'); if (t) post({ cmd: 'pin', id: +t.dataset.id }); });
  box.addEventListener('dragstart', e => { const t = e.target.closest('.tab'); if (t) e.dataTransfer.setData('text/halo-tab', t.dataset.id); });
  box.addEventListener('dragover', e => { const t = e.target.closest('.tab'); if (t) { e.preventDefault(); document.querySelectorAll('.dragover').forEach(n => n.classList.remove('dragover')); t.classList.add('dragover'); } });
  box.addEventListener('drop', e => {
    const t = e.target.closest('.tab'); const id = e.dataTransfer.getData('text/halo-tab');
    document.querySelectorAll('.dragover').forEach(n => n.classList.remove('dragover'));
    if (t && id) { e.preventDefault(); post({ cmd: 'move', id: +id, before: +t.dataset.id }); }
  });
  box.addEventListener('contextmenu', e => { const t = e.target.closest('.tab'); if (t) { e.preventDefault(); post({ cmd: 'pin', id: +t.dataset.id }); } });
}
$('#tabfilter').addEventListener('input', renderTabs);
$('#newtab-v').onclick = $('#newtab-h').onclick = () => { closePanels(); post({ cmd: 'newtab' }); };
$('#collapse').onclick = () => setS('collapsed', !S.settings.collapsed);
$('#b-back').onclick = () => post({ cmd: 'back' });
$('#b-fwd').onclick = () => post({ cmd: 'forward' });
$('#b-reload').onclick = () => post({ cmd: activeTab().loading ? 'stop' : 'reload' });
$('#b-star').onclick = () => post({ cmd: 'bookmark' });
$('#b-themes').onclick = $('#btn-themes-v').onclick = () => openPanel('p-themes');
$('#b-settings').onclick = $('#btn-settings-v').onclick = () => openSettings();
$('#b-dl').onclick = () => openSettings('downloads');
$('#b-ext').onclick = () => openPanel('p-ext');
$('#b-home').onclick = () => post({ cmd: 'home' });
$('#b-addext').onclick = () => { const id = $('#b-addext').dataset.id; if (id) post({ cmd: 'installExt', store: id }); };
$('#btn-bookmarks-v').onclick = () => openPanel('p-bookmarks');
$('#b-palette').onclick = () => openPalette();
$('#w-min').onclick = () => post({ cmd: 'win', action: 'min' });
$('#w-max').onclick = () => post({ cmd: 'win', action: 'max' });
$('#w-close').onclick = () => post({ cmd: 'win', action: 'close' });

// ---------- address bar + suggestions ----------
const addr = $('#addr');
let sugg = [], sel = -1, suggTimer = 0;
addr.addEventListener('focus', () => { const u = activeTab().url || ''; if (!isNewtab(u)) addr.value = u; setTimeout(() => addr.select(), 0); });
addr.addEventListener('input', () => {
  clearTimeout(suggTimer);
  const q = addr.value.trim();
  if (!q) { hideSugg(); return; }
  suggTimer = setTimeout(() => { if (S.settings.show_suggestions === false) showSugg([]); else post({ cmd: 'suggest', q }); }, 60);
});
addr.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const pick = sel >= 0 && sugg[sel];
    post({ cmd: 'navigate', text: pick ? pick.url : addr.value });
    hideSugg(); addr.blur();
  } else if (e.key === 'Escape') { hideSugg(); addr.value = isNewtab(activeTab().url) ? '' : activeTab().url; addr.blur(); post({ cmd: 'focusContent' }); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!sugg.length) return; e.preventDefault();
    sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + sugg.length + 1) % (sugg.length + 1) - 0;
    if (sel === sugg.length) sel = -1;
    paintSugg();
  }
});
addr.addEventListener('blur', () => setTimeout(hideSugg, 150));
function showSugg(list) {
  if (document.activeElement !== addr || !addr.value.trim()) return;
  const q = addr.value.trim();
  sugg = [{ kind: 'search', title: q, url: q, label: 'Search ' + engineName() }].concat(list);
  sel = -1; paintSugg();
  $('#sugg').classList.add('show'); syncOverlay();
}
function paintSugg() {
  $('#sugg').innerHTML = sugg.map((s, i) => '<div class="srow' + (i === sel ? ' sel' : '') + '" data-i="' + i + '">' +
    (s.kind === 'search' ? I.search : s.kind === 'tab' ? I.tab : s.kind === 'bookmark' ? I.starOn.replace('<svg', '<svg style="width:14px;height:14px"') : I.clock) +
    '<span class="t">' + esc(s.title || s.url) + '</span><span class="u">' + esc(s.kind === 'search' ? s.label : s.kind === 'tab' ? 'Switch to tab' : host(s.url)) + '</span></div>').join('');
}
function hideSugg() { if ($('#sugg').classList.contains('show')) { $('#sugg').classList.remove('show'); sugg = []; syncOverlay(); } }
$('#sugg').addEventListener('mousedown', e => {
  const r = e.target.closest('.srow'); if (!r) return;
  e.preventDefault();
  const s = sugg[+r.dataset.i];
  if (s.kind === 'tab') post({ cmd: 'activate', id: s.id }); else post({ cmd: 'navigate', text: s.url });
  hideSugg(); addr.blur();
});

// ---------- command bar ----------
function commands() {
  const c = [
    { title: 'New tab', k: 'Ctrl+T', run: () => post({ cmd: 'newtab' }) },
    { title: 'Reopen closed tab', k: 'Ctrl+Shift+T', run: () => post({ cmd: 'reopen' }) },
    { title: 'Bookmark this page', k: 'Ctrl+D', run: () => post({ cmd: 'bookmark' }) },
    { title: 'Show bookmarks', run: () => openPanel('p-bookmarks') },
    { title: 'Toggle compact sidebar', k: 'Ctrl+Shift+B', run: () => setS('collapsed', !S.settings.collapsed) },
    { title: 'Switch to ' + (S.settings.layout === 'horizontal' ? 'side tabs' : 'top tabs'), run: () => setS('layout', S.settings.layout === 'horizontal' ? 'vertical' : 'horizontal') },
    { title: 'Pin or unpin this tab', run: () => post({ cmd: 'pin', id: S.active }) },
    { title: 'Put other tabs to sleep', run: () => post({ cmd: 'sleepOthers' }) },
    { title: 'Zoom in', k: 'Ctrl++', run: () => post({ cmd: 'zoom', d: 1 }) },
    { title: 'Zoom out', k: 'Ctrl+-', run: () => post({ cmd: 'zoom', d: -1 }) },
    { title: 'Reset zoom', k: 'Ctrl+0', run: () => post({ cmd: 'zoom', d: 0 }) },
    { title: 'Themes and backgrounds', run: () => openPanel('p-themes') },
    { title: 'Settings', k: 'Ctrl+,', run: () => openSettings() },
    { title: 'Downloads', k: 'Ctrl+J', run: () => openSettings('downloads') },
    { title: 'Extensions', run: () => openPanel('p-ext') },
    { title: 'Manage extensions', run: () => openSettings('extensions') },
    { title: 'Add extensions from the Chrome Web Store', run: () => post({ cmd: 'open', url: 'https://chromewebstore.google.com/category/extensions', newTab: true }) },
    { title: 'Privacy and security settings', run: () => openSettings('privacy') },
    { title: 'Site permissions', run: () => openSettings('permissions') },
    { title: 'Search engine settings', run: () => openSettings('search') },
    { title: 'Go home', run: () => post({ cmd: 'home' }) },
    { title: 'Toggle bookmarks bar', run: () => setS('show_bookmarks_bar', !S.settings.show_bookmarks_bar) }
  ];
  for (const t of HALO_THEMES) c.push({ title: 'Theme: ' + t.name, run: () => { setS('theme', t.id); setS('custom_bg', false); } });
  return c;
}
let pitems = [], psel = 0;
function openPalette() {
  closePanels();
  $('#palette').classList.add('show'); syncOverlay();
  $('#pin').value = ''; fillPalette(); $('#pin').focus();
}
function fillPalette() {
  const q = $('#pin').value.trim().toLowerCase();
  const tabs = S.tabs.filter(t => !q || (t.title || '').toLowerCase().includes(q) || (t.url || '').toLowerCase().includes(q))
    .map(t => ({ title: t.title || 'New tab', sub: 'Tab', run: () => post({ cmd: 'activate', id: t.id }) }));
  const cmds = commands().filter(c => !q || c.title.toLowerCase().includes(q)).map(c => ({ title: c.title, sub: c.k || 'Command', run: c.run }));
  pitems = (q ? [{ title: 'Search ' + engineName() + ' for \u201c' + $('#pin').value.trim() + '\u201d', sub: 'Enter', run: () => post({ cmd: 'navigate', text: $('#pin').value.trim(), newTab: true }) }] : []).concat(tabs.slice(0, 8), cmds);
  psel = 0; paintPalette();
}
function paintPalette() {
  $('#plist').innerHTML = pitems.map((p, i) => '<div class="srow' + (i === psel ? ' sel' : '') + '" data-p="' + i + '">' + (p.sub === 'Tab' ? I.tab : p.sub === 'Enter' ? I.search : I.bolt) + '<span class="t">' + esc(p.title) + '</span><span class="k">' + esc(p.sub) + '</span></div>').join('');
  const s = $('#plist .sel'); if (s) s.scrollIntoView({ block: 'nearest' });
}
$('#pin').addEventListener('input', fillPalette);
$('#pin').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { psel = Math.min(pitems.length - 1, psel + 1); paintPalette(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { psel = Math.max(0, psel - 1); paintPalette(); e.preventDefault(); }
  else if (e.key === 'Enter') { const p = pitems[psel]; closePanels(); if (p) p.run(); }
  else if (e.key === 'Escape') { closePanels(); post({ cmd: 'focusContent' }); }
});
$('#plist').addEventListener('click', e => { const r = e.target.closest('[data-p]'); if (!r) return; const p = pitems[+r.dataset.p]; closePanels(); p.run(); });

// ---------- keyboard (while the frame has focus) ----------
document.addEventListener('keydown', e => {
  const c = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  let cmd = null;
  if (c && !e.shiftKey && k === 't') cmd = 'newtab';
  else if (c && e.shiftKey && k === 't') cmd = 'reopen';
  else if (c && k === 'w') cmd = 'close';
  else if ((c && k === 'l') || (e.altKey && k === 'd') || k === 'f6') { halo.cmd('focus'); e.preventDefault(); return; }
  else if (c && k === 'k') { openPalette(); e.preventDefault(); return; }
  else if (c && e.shiftKey && k === 'b') { setS('collapsed', !S.settings.collapsed); e.preventDefault(); return; }
  else if (c && k === 'tab') cmd = e.shiftKey ? 'prev' : 'next';
  else if (c && k === 'd') cmd = 'bookmark';
  else if (c && k === 'j') cmd = 'downloads';
  else if (c && k === ',') cmd = 'settings';
  else if (c && /^[1-9]$/.test(k)) cmd = 'tab' + k;
  else if (k === 'f5' || (c && k === 'r')) cmd = 'reload';
  else if (e.altKey && k === 'arrowleft') cmd = 'back';
  else if (e.altKey && k === 'arrowright') cmd = 'forward';
  else if (k === 'escape' && overlayOn) { closePanels(); post({ cmd: 'focusContent' }); return; }
  if (cmd) { e.preventDefault(); post({ cmd: 'key', key: cmd }); }
});

// ---------- window dragging and edge resizing ----------
const EDGE = 6;
function edgeAt(x, y) {
  const w = innerWidth, h = innerHeight;
  const n = y < EDGE, s = y > h - EDGE, wv = x < EDGE, ev = x > w - EDGE;
  return (n ? 'n' : s ? 's' : '') + (wv ? 'w' : ev ? 'e' : '');
}
const CURSOR = { n: 'ns-resize', s: 'ns-resize', e: 'ew-resize', w: 'ew-resize', ne: 'nesw-resize', sw: 'nesw-resize', nw: 'nwse-resize', se: 'nwse-resize' };
document.addEventListener('mousemove', e => { const d = edgeAt(e.clientX, e.clientY); document.documentElement.style.cursor = d ? CURSOR[d] : ''; });
document.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const d = edgeAt(e.clientX, e.clientY);
  if (d) { e.preventDefault(); post({ cmd: 'win', action: 'resize', dir: d }); return; }
  if (e.target.closest('button,input,select,label,.tab,#omni,.panel,a')) return;
  if (e.target.closest('.drag')) {
    if (e.detail === 2) post({ cmd: 'win', action: 'max' }); else post({ cmd: 'win', action: 'drag' });
  }
});

post({ cmd: 'ready' });
</script>
